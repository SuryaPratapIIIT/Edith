  <!-- ========================================================================= -->
  <g transform="translate(60, 455)">
    <rect x="0" y="0" width="510" height="310" rx="20" fill="url(#cardBg)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="0" y="0" width="510" height="42" rx="20" fill="#201538" fill-opacity="0.8" />
    <circle cx="24" cy="21" r="5" fill="#a855f7" />
    <text x="38" y="26" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1">3. FASTAPI TELEMETRY &amp; GMDA ITMS BACKEND (PYTHON 3.13)</text>

    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="225" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" font-size="11.5" font-weight="700" fill="#e2e8f0">Real-Time Sync Engine</text>
      <text x="14" y="42" font-size="10.5" fill="#94a3b8">POST /api/telemetry/live</text>
      <text x="14" y="60" font-size="10" fill="#cbd5e1">• Sub-50ms Telemetry Stream</text>
      <text x="14" y="76" font-size="10" fill="#cbd5e1">• Live Speed, Limit &amp; Camera State</text>
      <text x="14" y="94" font-size="10" fill="#c084fc">• Session Store State Isolation</text>

      <rect x="245" y="0" width="225" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" font-size="11.5" font-weight="700" fill="#e2e8f0">GMDA ITMS Dataset</text>
      <text x="14" y="42" font-size="10.5" fill="#94a3b8">70+ Calibrated Gantry Nodes</text>
      <text x="14" y="60" font-size="10" fill="#cbd5e1">• Shankar Chowk, Signature Tower</text>
      <text x="14" y="76" font-size="10" fill="#cbd5e1">• Rajiv Chowk, Kherki Daula, Sohna</text>
      <text x="14" y="94" font-size="10" fill="#c084fc">• Centerline Vector Snapped</text>

      <!-- Tool Provider Block -->
      <rect x="0" y="122" width="470" height="110" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="800" fill="#c084fc">Bolna Function Tool Gateway (GET /api/live/status)</text>
      <text x="16" y="44" font-size="10.5" fill="#94a3b8">Exposes live vehicle telemetry directly to Bolna AI Cloud through reverse tunnel</text>
      
      <rect x="16" y="56" width="438" height="48" rx="8" fill="#1e1833" />
      <text x="26" y="76" font-family="Courier, monospace" font-size="10" fill="#e9d5ff">HTTP 200 { speed: "92 km/h", limit: "70 km/h", camera: "100m", risk: "safe" }</text>
      <text x="26" y="94" font-size="9" fill="#a855f7">✓ Zero Stale Data Guarantee · Evaluated instantly on LLM tool trigger</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 4: BOLNA VOICE AI INFRASTRUCTURE (RIGHT BOTTOM) -->
  <!-- ========================================================================= -->
  <g transform="translate(630, 455)">
    <rect x="0" y="0" width="510" height="310" rx="20" fill="url(#cardBg)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="0" y="0" width="510" height="42" rx="20" fill="#2d1c08" fill-opacity="0.8" />
    <circle cx="24" cy="21" r="5" fill="#f59e0b" />
    <text x="38" y="26" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="1">4. BOLNA VOICE AI &amp; FRIDAY CO-PILOT INFRASTRUCTURE</text>

    <g transform="translate(20, 58)">
      <!-- Audio Pipeline Flow -->
      <rect x="0" y="0" width="145" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#fef08a">1. Deepgram Nova-3</text>
      <text x="12" y="38" font-size="9.5" fill="#94a3b8">Real-Time Streaming ASR</text>
      <text x="12" y="58" font-size="9.5" fill="#cbd5e1">• Latency: &lt;150ms</text>
      <text x="12" y="74" font-size="9.5" fill="#cbd5e1">• VAD Silence Trim</text>
      <text x="12" y="92" font-size="9.5" fill="#f59e0b">• Hinglish + English</text>

      <rect x="160" y="0" width="150" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#fef08a">2. Azure GPT-4o-mini</text>
      <text x="12" y="38" font-size="9.5" fill="#94a3b8">Autonomous Agent Flow</text>
      <text x="12" y="58" font-size="9.5" fill="#cbd5e1">• FRIDAY Co-Pilot Persona</text>
      <text x="12" y="74" font-size="9.5" fill="#cbd5e1">• Calls get_live_telemetry</text>
      <text x="12" y="92" font-size="9.5" fill="#f59e0b">• 3600s Continuous Call</text>

      <rect x="325" y="0" width="145" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#fef08a">3. ElevenLabs Turbo</text>
      <text x="12" y="38" font-size="9.5" fill="#94a3b8">Neural Voice Synthesis</text>
      <text x="12" y="58" font-size="9.5" fill="#cbd5e1">• Voice: Angelica</text>
      <text x="12" y="74" font-size="9.5" fill="#cbd5e1">• 220-byte Audio Chunks</text>
      <text x="12" y="92" font-size="9.5" fill="#f59e0b">• Natural In-Car Audio</text>

      <!-- Local Proactive Alert Engine -->
      <rect x="0" y="122" width="470" height="110" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="800" fill="#fbbf24">Dual-Engine Voice Delivery Architecture</text>
      <text x="16" y="44" font-size="10" fill="#94a3b8">Two voice conduits work in harmony to prevent missed safety alerts while driving:</text>

      <rect x="16" y="56" width="210" height="50" rx="8" fill="#1e1b12" />
      <text x="24" y="74" font-size="10.5" font-weight="700" fill="#fef08a">Converse: Bolna Cloud AI</text>
      <text x="24" y="92" font-size="9" fill="#cbd5e1">Two-way natural conversation on user query</text>

      <rect x="240" y="56" width="214" height="50" rx="8" fill="#1e1b12" />
      <text x="248" y="74" font-size="10.5" font-weight="700" fill="#34d399">Proactive: Zero-Latency Engine</text>
      <text x="248" y="92" font-size="9" fill="#cbd5e1">Instant 100m camera &amp; spot speed radar warnings</text>
    </g>
  </g>

  <!-- Connective Arrows & Data Flow Badges -->
  <g stroke="#06b6d4" stroke-width="2" opacity="0.6" stroke-dasharray="4,4">
    <!-- Top Horizontal Data Link -->
    <line x1="570" y1="230" x2="630" y2="230" />
    <!-- Bottom Horizontal Data Link -->
    <line x1="570" y1="610" x2="630" y2="610" />
    <!-- Left Vertical Data Link -->
    <line x1="315" y1="425" x2="315" y2="455" />
    <!-- Right Vertical Data Link -->
    <line x1="885" y1="425" x2="885" y2="455" />
  </g>

  <!-- Flow Badges in the center -->
  <g transform="translate(565, 218)">
    <circle cx="15" cy="12" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="15" y="16" font-size="10" font-weight="bold" fill="#06b6d4" text-anchor="middle">⇄</text>
  </g>
  <g transform="translate(565, 598)">
    <circle cx="15" cy="12" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="16" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">⇄</text>
  </g>
</svg>

